<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Tools Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .container { width: 100%; max-width: 400px; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
    p { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
    .grid { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: #38bdf8;
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card:active { background: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛠️ Quick Tools Hub</h1>
    <p>Opens in new tab for easy back access</p>
    
    <div class="grid">
      <a class="card" href="https://chong95123.github.io/materialcalculator/" target="_blank">
        <span>📐 Material Calculator</span>
        <span>➔</span>
      </a>

      <a class="card" href="https://chong95123.github.io/site-manager-/" target="_blank">
        <span>🏗️ Site Manager</span>
        <span>➔</span>
      </a>

      <a class="card" href="https://chong95123.github.io/Tools/" target="_blank">
        <span>🛠️ Tools Hub</span>
        <span>➔</span>
      </a>


      <a class="card" href="https://chong95123.github.io/Quotation-generator/" target="_blank">
        <span>� Quotation Generator</span>
        <span>➔</span>
      </a>


    </div>
  </div>
</body>
</html>
