<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tools Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 24px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s, transform 0.1s;
    }
    .card:active {
      transform: scale(0.98);
      background: #334155;
    }
    .title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #38bdf8;
    }
    .icon {
      font-size: 1.2rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Quick Tools</h1>
    <p>Select a tool to launch</p>
    
    <div class="grid">
      <a class="card" href="https://chong95123.github.io/materialcalculator/" target="_blank">
        <span class="title">📐 Material Calculator</span>
        <span class="icon">➔</span>
      </a>

      <a class="card" href="https://chong95123.github.io/site-manager-/" target="_blank">
        <span class="title">🏗️ Site Manager</span>
        <span class="icon">➔</span>
      </a>

      <a class="card" href="https://chong95123.github.io/Tools/" target="_blank">
        <span class="title">🛠️ Agent tool</span>
        <span class="icon">➔</span>
      </a>
    </div>
  </div>
</body>
</html>
